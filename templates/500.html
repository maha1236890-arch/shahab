{% extends "base.html" %}
{% block title %}خطأ في الخادم — 500{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center py-5" style="min-height:60vh">
  <div style="font-size:6rem;line-height:1;color:#f8d7da;font-weight:800;letter-spacing:-4px">500</div>
  <h3 class="mt-3 mb-2 fw-bold">خطأ في الخادم</h3>
  <p class="text-muted mb-4" style="max-width:400px">
    حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى، أو التواصل مع المسؤول إذا استمرت المشكلة.
  </p>
  <div class="d-flex gap-2 flex-wrap justify-content-center">
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-house me-2"></i>الرئيسية
    </a>
    <button onclick="location.reload()" class="btn btn-outline-secondary px-4">
      <i class="fa-solid fa-rotate-right me-2"></i>إعادة المحاولة
    </button>
  </div>
</div>
{% endblock %}
