{% extends "base.html" %}
{% block title %}الصفحة غير موجودة — 404{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center py-5" style="min-height:60vh">
  <div style="font-size:6rem;line-height:1;color:#dee2e6;font-weight:800;letter-spacing:-4px">404</div>
  <h3 class="mt-3 mb-2 fw-bold">الصفحة غير موجودة</h3>
  <p class="text-muted mb-4" style="max-width:400px">
    الصفحة التي تبحث عنها غير موجودة، أو ربما تم نقلها أو حذفها.
  </p>
  <div class="d-flex gap-2 flex-wrap justify-content-center">
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-house me-2"></i>الرئيسية
    </a>
    <button onclick="history.back()" class="btn btn-outline-secondary px-4">
      <i class="fa-solid fa-arrow-right me-2"></i>رجوع
    </button>
  </div>
</div>
{% endblock %}
