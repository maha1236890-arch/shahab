name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # تشغيل يدوي من صفحة Actions

jobs:
  build-windows:
    name: Build .exe on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller employee_system.spec --clean --noconfirm

      - name: List output
        run: dir dist

      - name: Build Windows Installer (Inno Setup)
        run: |
          choco install innosetup --yes --no-progress
          iscc installer.iss

      - name: List installer output
        run: dir installer_output

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeSystem-Windows-Installer
          path: installer_output/
          retention-days: 30
