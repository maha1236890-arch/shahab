name: Build Linux Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Qt5 + display)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1-mesa-glx libglib2.0-0 libdbus-1-3 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 openpyxl pyinstaller

      - name: Build Linux binary with PyInstaller
        run: |
          pyinstaller employee_system.spec --clean --noconfirm

      - name: List output
        run: ls -lh dist/

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeSystem-Linux
          path: dist/
          retention-days: 30
